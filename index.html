      if(g===2){r[3]=Math.max(130,r[3]-15);n=Math.max(iv+1,Math.round(iv*1.2))}
      else if(g===3){n=Math.max(iv+1,Math.round((iv+late/2)*r[3]/100))}
      else{r[3]+=15;n=Math.max(iv+2,Math.round((iv+late)*r[3]/100*1.3))}
      n=Math.min(cap,fuzz(n));if(g===4&&n<=iv&&cap>iv)n=iv+1;
      r[2]=Math.max(1,n);r[1]=reviewDue(r[2])}
  }
  r[4]++;r[7]=now;return r;
}

function subsOn(stage){const s=S();const on=s.subs[stage];return SUBS.filter(x=>x.st===stage&&(!on||on[x.id]!==false))}
function newLimit(stage){
  const s=S();if(s.newMode!=='auto')return s.newPerDay;
  const left=DATA.cards.filter(c=>c.d===stage&&isNew(P[c.i])&&subsOn(stage).some(x=>x.id===c.b)).length;
  const now=Date.now();let days=Math.ceil((STAGES[stage].date-now)/DAY)-2;if(stage==='s'||days<1)days=Math.max(1,days);
  return Math.max(10,Math.min(80,Math.ceil(left/Math.max(1,days))));
}
function counts(subIds,now){
  const end=dayStart(dayNum(now)+1);let n=0,l=0,r=0;const list=DATA.cards.filter(c=>subIds.has(c.b));const ok=reps(list);
  for(const c of list){if(!ok(c))continue;const p=P[c.i];
    if(isNew(p))n++;else if(p[0]===2){if(p[1]<end)r++}else if(p[1]<=now+20*MIN)l++}
  return {n,l,r};
}
function reps(list){const rep={};for(const c of list){if(!c.sb)continue;const cur=rep[c.sb];if(!cur){rep[c.sb]=c;continue}const p=P[c.i],pc=P[cur.i];if(!isNew(p)&&(isNew(pc)||p[7]>pc[7]))rep[c.sb]=c}return c=>!c.sb||rep[c.sb]===c}
function newIntroduced(){return dstat(today()).n}
function buildQueue(stage){
  const now=Date.now(),end=dayStart(dayNum(now)+1);const ids=new Set(subsOn(stage).map(x=>x.id));
  const ord={};SUBS.forEach(x=>ord[x.id]=x.ord);
  const lrn=[],rev=[],nw=[];const seen=new Set();
  const cand=DATA.cards.filter(c=>ids.has(c.b)).sort((a,b)=>ord[a.b]-ord[b.b]);
  const ok=reps(cand);
  for(const c of cand){if(!ok(c))continue;const p=P[c.i];
    if(isNew(p))nw.push(c);else if(p[0]===2){if(p[1]<end)rev.push(c)}else lrn.push(c)}
  nw.sort((a,b)=>(ord[a.b]-ord[b.b])||(hash(a.i)-hash(b.i)));
  rev.sort((a,b)=>hash(a.i+today())-hash(b.i+today()));
  return {stage,ids,lrn,rev,nw,since:0};
}
function nextCard(q){
  const now=Date.now();
  q.lrn=q.lrn.filter(c=>!isNew(P[c.i])&&P[c.i][0]!==2);
  q.rev=q.rev.filter(c=>P[c.i]&&P[c.i][0]===2&&P[c.i][1]<dayStart(dayNum(now)+1));
  q.nw=q.nw.filter(c=>isNew(P[c.i]));
  const dueL=q.lrn.filter(c=>P[c.i][1]<=now).sort((a,b)=>P[a.i][1]-P[b.i][1]);
  if(dueL.length)return dueL[0];
  const newLeft=Math.max(0,newLimit(q.stage)-newIntroduced());
  const wantNew=newLeft>0&&q.nw.length&&(q.since>=3||!q.rev.length);
  if(wantNew){q.since=0;return q.nw[0]}
  if(q.rev.length){q.since++;return q.rev[0]}
  const soon=q.lrn.filter(c=>P[c.i][1]<=now+20*MIN).sort((a,b)=>P[a.i][1]-P[b.i][1]);
  if(soon.length)return soon[0];
  return null;
}

async function flush(){

function trimDays(d){const keys=Object.keys(d).sort().slice(-400);const o={};keys.forEach(k=>o[k]=d[k]);return o}
function mergeRemote(id,data){
  if(!data)return false;let changed=false;
  if(/^p\d+$/.test(id)&&data.c){
    for(const k in data.c){const rr=data.c[k];if(!Array.isArray(rr))continue;
      if(!P[k]||rr[7]>P[k][7]){P[k]=rr;changed=true}else if(P[k][7]>rr[7])dirty.add(id)}
  }else if(id==='meta'){
    if(data.set&&(data.setU||0)>(M.setU||0)){M.set=data.set;M.setU=data.setU;changed=true;applyTheme()}
    if((data.resetAt||0)>(M.resetAt||0)){M.days={};M.tags={};M.tests=[];M.finals=[];M.les={};M.resetAt=data.resetAt;changed=true}
    if((data.u||0)<(M.resetAt||0))return changed;
    for(const k in (data.days||{})){const a=dstat(k),b=data.days[k];for(const f of ['n','r','ok','bad','ms'])if((b[f]||0)>(a[f]||0)){a[f]=b[f];changed=true}}
    for(const k in (data.tags||{})){const a=M.tags[k]||[0,0],b=data.tags[k];if(b[1]>a[1]){M.tags[k]=b;changed=true}}
    const seen=new Set(M.tests.map(t=>t.d));for(const t of (data.tests||[]))if(!seen.has(t.d)){M.tests.push(t);changed=true}
    M.tests.sort((a,b)=>a.d-b.d);
    const seenF=new Set(M.finals.map(t=>t.d));for(const t of (data.finals||[]))if(!seenF.has(t.d)){M.finals.push(t);changed=true}
    M.finals.sort((a,b)=>a.d-b.d);
    M.les=M.les||{};for(const k in (data.les||{})){const b=data.les[k];if(b&&(!M.les[k]||(b.u||0)>(M.les[k].u||0))){M.les[k]=b;changed=true}}
  }
  return changed;
}

function finTot(){return FIN.mode==='p'?FIN.sc.reduce((a,s)=>a+(s.pk||0),0):FIN.sc.reduce((a,s)=>a+CRIT.reduce((b,[k])=>b+s[k],0),0)}
function finMax(){return FIN.mode==='p'?30:45}
function finVerdict(t){if(FIN&&FIN.mode==='p')return t>=24?'<b>Bardzo dobry wynik</b> – laureatami zostaje 10 najlepszych (o kolejności decyduje suma z testu i części ustnej)':t>=15?'<b>Dobry wynik</b> – finalistą jest uczestnik III etapu z co najmniej 20 pkt łącznie':'Słaby wynik – powtórz pytania problemowe';return t>=25?'<b>Poziom laureata</b> (min. 25 pkt wg § 12 ust. 4 regulaminu)':t>=15?'<b>Poziom finalisty</b> (min. 15 pkt)':'Poniżej progu finalisty (15 pkt)'}
function aiFinal(i){const F=FIN;if(!F)return;const q=F.qs[i];const pip=F.mode==='p';
  return aiGrade('f'+i,{org:pip?'III etapu (części ustnej) Ogólnopolskiej Olimpiady Wiedzy o Państwie i Prawie':'finału Olimpiady Wiedzy o Prawie (wypowiedź ustna na wylosowane zagadnienie)',oral:true,q:strip(q.q),ref:refText(q.refs)||'(brak odpowiedzi wzorcowej – oceń według obowiązującego prawa)',ans:F.txt[i]||'',
    max:pip?10:15,crit:pip?null:CRIT,rubric:'9–10 – pełna, uporządkowana odpowiedź z podstawą prawną i przykładami; 6–8 – dobra z brakami; 3–5 – częściowa; 1–2 – fragmentaryczna; 0 – brak lub błędna',
    apply:r=>{if(FIN!==F)return;if(pip)F.sc[i].pk=r.punkty;else for(const [k] of CRIT)F.sc[i][k]=r.kryteria[k]}})}
function startFinal(qs,name,mode){for(const k in AIG)if(k[0]==='f')delete AIG[k];if(DICT&&DICT.active())DICT.stop().catch(()=>{});DT=null;FIN={qs,name,mode:mode||'',phase:'prep',t0:Date.now(),txt:qs.map(()=>''),sc:qs.map(()=>({meritum:0,org:0,styl:0,popr:0,pk:0}))};clearInterval(rFinal._iv);rFinal._iv=setInterval(tickFinal,1000);rFinal()}
function tickFinal(){const el=$('#fclock');if(!FIN||!el)return;const lim=(FIN.mode==='p'&&FIN.phase==='prep'?5:10)*MIN,used=Date.now()-FIN.t0,l=lim-used;el.textContent=(l>=0?fmtClock(l):'+'+fmtClock(-l));el.classList.toggle('low',l<MIN)}

function rOpts(){

  else acct=`<p>Postęp zapisuje się tylko w tej przeglądarce. Aby przenieść go na inne urządzenie, użyj kodu postępu poniżej.</p>`;
  el.innerHTML=`<div class="panel stack"><h2>Zapis postępów</h2>${acct}</div>
  <div class="panel stack"><h2>Nauka</h2>
   <div class="row"><label for="o-newmode">Nowe karty dziennie</label><select id="o-newmode"><option value="auto">automatycznie (teraz ${auto})</option><option value="man">ręcznie</option></select><input type="number" id="o-new" min="0" max="300" value="${s.newPerDay}" style="width:90px" ${s.newMode==='auto'?'disabled':''}></div>
   <div class="row"><label for="o-max">Najdłuższy odstęp między powtórkami</label><input type="number" id="o-max" min="2" max="120" value="${s.maxIvl}" style="width:90px"><span class="small muted">dni (i nie dłużej niż połowa czasu do etapu)</span></div>
   ${window.claude?'':`<div class="row"><label for="o-theme">Motyw</label><select id="o-theme"><option value="system">systemowy</option><option value="light">jasny</option><option value="dark">ciemny</option></select></div>`}
  </div>
  ${Cloud.mode==='firebase'&&Cloud.uid?`<div class="panel stack"><h2>Zestawienie znajomych</h2><p class="small muted">Inne zalogowane osoby z linkiem zobaczą Twój pseudonim i liczby (opanowane karty, seria dni, wynik testu). Treść odpowiedzi nie jest udostępniana.</p><div class="row"><input type="text" id="o-nick" placeholder="Pseudonim" maxlength="30" value="${esc(s.nick)}"><label class="small"><input type="checkbox" id="o-board" ${s.board?'checked':''}> pokazuj mnie</label></div></div>`:''}
  <div class="panel stack"><h2>Kod postępu</h2><p class="small muted">Kopia całego postępu jako tekst – do przeniesienia na inne urządzenie bez konta albo na wszelki wypadek.</p>
   <div class="row"><button class="btn" id="o-exp" type="button">Utwórz i skopiuj kod</button><button class="btn" id="o-imp" type="button">Wczytaj kod z pola</button><button class="btn" id="o-fsave" type="button">Zapisz kopię do pliku</button><label class="btn" for="o-fload">Wczytaj kopię z pliku</label><input type="file" id="o-fload" accept=".txt,text/plain" hidden></div>

  <div class="panel stack"><h2>Zerowanie</h2><p class="small muted">Usuwa cały postęp i statystyki.</p><div class="row"><button class="btn" id="o-reset" type="button">Wyzeruj wszystko</button></div></div>
  <p class="small muted">Wersja kart: ${esc(DATA.v)} · ${DATA.n} kart.</p>`;
  $('#o-newmode').value=s.newMode==='auto'?'auto':'man';
  $('#o-newmode').onchange=e=>{setS({newMode:e.target.value==='auto'?'auto':'man'});rOpts()};
  $('#o-new').onchange=e=>setS({newPerDay:Math.max(0,Math.min(300,+e.target.value||0))});
  $('#o-max').onchange=e=>setS({maxIvl:Math.max(2,Math.min(120,+e.target.value||21))});
  if($('#o-theme')){$('#o-theme').value=s.theme;$('#o-theme').onchange=e=>{setS({theme:e.target.value});applyTheme()}}
  if($('#o-login'))$('#o-login').onclick=()=>Cloud.login&&Cloud.login();
  if($('#o-logout'))$('#o-logout').onclick=()=>Cloud.logout&&Cloud.logout();
  if($('#o-nick'))$('#o-nick').onchange=e=>setS({nick:e.target.value.trim().slice(0,30)});
  if($('#o-board'))$('#o-board').onchange=e=>{setS({board:e.target.checked});if(!e.target.checked&&Cloud.unboard)Cloud.unboard().catch(()=>{})};
  $('#o-exp').onclick=async()=>{const code=await packCode();$('#o-code').value=code;try{await navigator.clipboard.writeText(code);toast('Kod skopiowany')}catch(e){$('#o-code').select();toast('Zaznaczono kod – skopiuj go ręcznie')}};
  $('#o-fsave').onclick=async()=>{const code=await packCode();const name='kurs-prawa-postep-'+new Date().toISOString().slice(0,10)+'.txt';const dl=await getDL();
    if(dl){try{await dl.save({filename:name,data:new Blob([code],{type:'text/plain'})})}catch(e){}return}
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([code],{type:'text/plain'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)};
  $('#o-fload').onchange=async e=>{const f=e.target.files[0];if(!f)return;$('#o-code').value=(await f.text()).trim();$('#o-imp').click()};
  $('#o-imp').onclick=async()=>{try{const d=await unpackCode($('#o-code').value.trim());let n=0;for(const k in d.P){if(!P[k]||d.P[k][7]>P[k][7]){P[k]=d.P[k];dirty.add(bucket(k));n++}}mergeRemote('meta',Object.assign({},d.M,{u:Date.now()}));metaDirty=true;persist();toast(`Wczytano – zaktualizowano ${n} ${plural(n,'kartę','karty','kart')}`)}catch(e){toast('To nie jest poprawny kod postępu')}};
  $('#o-reset').onclick=()=>{const b=$('#o-reset');if(!b.dataset.c){b.dataset.c=1;b.textContent='Na pewno? Kliknij jeszcze raz';return}
    const now=Date.now();for(const k in P){P[k]=[0,0,0,250,0,0,0,now];dirty.add(bucket(k))}const set=M.set,setU=M.setU;M={set,setU,days:{},tags:{},tests:[],finals:[],les:{},resetAt:now};metaDirty=true;persist();toast('Postęp wyzerowany');rOpts()};
}
async function packCode(){const json=JSON.stringify({P,M:{days:M.days,tags:M.tags,tests:M.tests,finals:M.finals,les:M.les,set:M.set,setU:M.setU},v:1});
  if(window.CompressionStream){const s=new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'));const buf=new Uint8Array(await new Response(s).arrayBuffer());let b='';for(let i=0;i<buf.length;i+=8192)b+=String.fromCharCode.apply(null,buf.subarray(i,i+8192));return 'OWOP1.'+btoa(b)}
  return 'OWOP0.'+btoa(unescape(encodeURIComponent(json)))}
async function unpackCode(code){if(code.startsWith('OWOP1.')){const bin=atob(code.slice(6));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);const s=new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'));return JSON.parse(await new Response(s).text())}
  if(code.startsWith('OWOP0.'))return JSON.parse(decodeURIComponent(escape(atob(code.slice(6)))));throw new Error('zły kod')}

/* ===== Start ===== */
$('#sync').onclick=()=>{location.hash='opcje'};
document.querySelectorAll('#tabs a').forEach(a=>a.addEventListener('click',e=>{if(VIEW==='sesja'&&a.dataset.v==='nauka'){e.preventDefault();endSession()}}));

  for(const c of DATA.cards){CARD[c.i]=c;if(c.sb)(SIB[c.sb]=SIB[c.sb]||[]).push(c.i)}SUBS=DATA.subs;
  for(const t of (DATA.tasks||[]))CARD[t.i]=t;
  {const SAN=/[\uE000-\uF8FF\u25A0-\u25FF\u2610-\u2612\u2751\u274F]/g,san=v=>typeof v==='string'?v.replace(SAN,'').replace(/^\s+/,''):v;for(const c of DATA.cards){c.q=san(c.q);if(c.o)c.o=c.o.map(san);c.e=san(c.e)}}
  go(location.hash.slice(1)||'nauka');
  setInterval(renderCountdown,60000);
  initCloud();initAI();
})();
